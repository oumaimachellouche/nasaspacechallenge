name: Validate TRACE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare_boundaries.py
      - run: git diff --exit-code -- public/data/study-wilayas.geojson public/data/wilaya-display-metadata.json
      - run: npm ci
      - run: npm run test:data
      - run: npm run test:api
      - run: npm run build
